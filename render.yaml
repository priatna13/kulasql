services:
  - type: web
    name: kulasql
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build -w frontend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
